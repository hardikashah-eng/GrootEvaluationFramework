# Single arm with a parallel gripper. PLACEHOLDER NUMBERS: replace with your robot's values.
schema_version: 1
name: arm_gripper_example
template: arm_gripper
embodiment_tag: new_embodiment
frames: {base: base_link, quat_order: wxyz}
timing: {control_hz: 100, policy_hz: 10, action_horizon: 16, max_latency_ms: 80}
safety: {max_action_rate: 0.05, velocity_scale: 0.3}
assets: {urdf: assets/arm/robot.urdf}
groups:
  - name: arm
    kind: arm
    joint_defaults: {max_velocity: 2.0, effort_limit: 40, stiffness: 400, damping: 40}
    joints:
      - {name: joint1, limits: [-2.9, 2.9]}
      - {name: joint2, limits: [-1.76, 1.76]}
      - {name: joint3, limits: [-2.9, 2.9]}
      - {name: joint4, limits: [-3.07, -0.07]}
      - {name: joint5, limits: [-2.9, 2.9]}
      - {name: joint6, limits: [-0.02, 3.75]}
      - {name: joint7, limits: [-2.9, 2.9]}
  - name: gripper
    kind: gripper
    robot_range: [0.08, 0.0]    # metres of finger opening: open 0.08, closed 0.0
    joints: [{name: finger_joint, limits: [0.0, 1.0]}]
cameras:
  - {name: wrist, width: 320, height: 240, fps: 30, color_order: rgb,
     intrinsics: {fx: 200.0, fy: 200.0, cx: 160.0, cy: 120.0}, parent_frame: hand}
  - {name: front, width: 640, height: 480, fps: 30, color_order: rgb,
     intrinsics: {fx: 600.0, fy: 600.0, cx: 320.0, cy: 240.0}, parent_frame: world}
