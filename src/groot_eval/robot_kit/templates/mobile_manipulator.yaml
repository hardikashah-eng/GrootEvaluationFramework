# Wheeled base with one arm and a gripper. Base commands are velocities (relative), arm is absolute.
# PLACEHOLDER NUMBERS: replace with your robot's values.
schema_version: 1
name: mobile_manipulator_example
template: mobile_manipulator
embodiment_tag: new_embodiment
frames: {base: base_link, quat_order: wxyz}
timing: {control_hz: 50, policy_hz: 10, action_horizon: 16, max_latency_ms: 100}
safety: {max_action_rate: 0.05, velocity_scale: 0.3}
assets: {urdf: assets/mobile/robot.urdf}
groups:
  - name: base
    kind: base
    action: relative           # planar pose deltas: x (m), y (m), yaw (rad)
    joint_defaults: {max_velocity: 0.5}
    joints:
      - {name: base_x, limits: [-100.0, 100.0]}
      - {name: base_y, limits: [-100.0, 100.0]}
      - {name: base_yaw, limits: [-3.1416, 3.1416]}
  - name: arm
    kind: arm
    joint_defaults: {max_velocity: 2.0, effort_limit: 40, stiffness: 300, damping: 30}
    joints:
      - {name: arm_joint1, limits: [-2.9, 2.9]}
      - {name: arm_joint2, limits: [-1.76, 1.76]}
      - {name: arm_joint3, limits: [-2.9, 2.9]}
      - {name: arm_joint4, limits: [-3.07, -0.07]}
      - {name: arm_joint5, limits: [-2.9, 2.9]}
      - {name: arm_joint6, limits: [-0.02, 3.75]}
  - name: gripper
    kind: gripper
    robot_range: [0.0, 255.0]
    joints: [{name: gripper_joint, limits: [0.0, 1.0]}]
cameras:
  - {name: head, width: 640, height: 480, fps: 30, intrinsics: {fx: 600.0, fy: 600.0, cx: 320.0, cy: 240.0}}
  - {name: wrist, width: 424, height: 240, fps: 30, intrinsics: {fx: 210.0, fy: 210.0, cx: 212.0, cy: 120.0}}
